name: Temporary PR26 C++ formatter

on:
  push:
    branches:
      - feat/ybx-native-account-qr-20261104
    paths:
      - '.github/workflows/temporary-pr26-format.yml'
      - 'src/**'
      - 'test/**'

permissions:
  contents: write

concurrency:
  group: temporary-pr26-formatter
  cancel-in-progress: false

jobs:
  format:
    if: github.repository == 'jhdvp/ybx-crosspoint'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ybx-native-account-qr-20261104
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned clang-format
        run: python -m pip install --disable-pip-version-check clang-format==21.1.8
      - name: Format only C++ source changed in this PR
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base HEAD origin/fix/ybx-sleep-companion-grayscale-20261104)"
          while IFS= read -r -d '' file; do
            if [[ -f "$file" && "$file" =~ \.(h|hpp|cpp|cc|c)$ ]]; then
              clang-format -i "$file"
            fi
          done < <(git diff --name-only -z "$base" HEAD -- src test)
          if ! git diff --quiet -- src test; then
            git config user.name "ybx-format-bot"
            git config user.email "ybx-format-bot@users.noreply.github.com"
            git add -- src test
            git commit -m "style(reader): apply clang-format 21 to native YBX changes"
            git push origin HEAD:feat/ybx-native-account-qr-20261104
          fi
